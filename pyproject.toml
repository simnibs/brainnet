[project]
name = "BrainNet"
version = "0.2"
description = "Neural network for various neuroimaging related tasks (e.g., segmentation)."
maintainers = [{ name = "Jesper Duemose Nielsen" }]
requires-python = ">=3.11"
dependencies = [
    "brainsynth",
    "pytorch-ignite >= 0.4",
    "nibabel >= 5.1",
    "numpy >= 1.26",
    "scipy >= 1.11",
    "torch >= 2.1",
    "tqdm >= 4.67",
]

[build-system]
requires = ["setuptools>=69.2", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
train = ["wandb >= 0.16"]

[tool.setuptools.package-data]
brainnet = [
    "mesh/cuda/extensions.cpp",
    "mesh/cuda/nearest_neighbor.cu",
    "mesh/cuda/self_intersections.cu",
    "resources/models/topofit/*",
    "resources/models/trega/*",
]

[project.scripts]
brainnet = "brainnet.bin.predict:main"
